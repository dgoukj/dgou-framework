# 缓存配置
cache:
  type: redis                    # 缓存类型：redis, memory
  prefix: app                   # 缓存键前缀
  default_ttl: 3600             # 默认过期时间(秒)
  enable_stats: true            # 启用统计
  max_memory_mb: 100            # 内存缓存最大内存(MB)

# Redis配置
redis:
  addr: localhost:6379          # Redis地址
  password: ""                  # 密码
  db: 0                         # 数据库索引
  pool_size: 100                # 连接池大小
  min_idle_conns: 10            # 最小空闲连接数
  max_retries: 3                # 最大重试次数

# 缓存一致性配置
cache_consistency:
  enable_write_through: true    # 启用写穿透
  enable_write_behind: false    # 禁用写回
  enable_read_through: true     # 启用读穿透
  invalidation_delay: 1s        # 失效延迟
  double_delete_delay: 1s       # 双删延迟

# 缓存防护配置
cache_protection:
  enable_bloom_filter: true     # 启用布隆过滤器
  bloom_filter_size: 100000     # 布隆过滤器大小
  bloom_filter_error_rate: 0.001 # 错误率
  enable_circuit_breaker: true  # 启用熔断器
  circuit_breaker_threshold: 10 # 熔断器阈值
  circuit_breaker_timeout: 30s  # 熔断器超时