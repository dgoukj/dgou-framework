# 主库配置
master:
  host: localhost
  port: 3306
  user: root
  password: password123
  dbname: myapp
  charset: utf8mb4
  parse_time: true
  loc: Local

# 从库配置列表
slaves:
  - host: slave1.localhost
    port: 3306
    user: root
    password: password123
    dbname: myapp
    charset: utf8mb4
    parse_time: true
    loc: Local
    name: slave_1

  - host: slave2.localhost
    port: 3306
    user: root
    password: password123
    dbname: myapp
    charset: utf8mb4
    parse_time: true
    loc: Local
    name: slave_2

# 连接池配置
pool:
  max_open_conns: 200
  max_idle_conns: 50
  conn_max_lifetime: 1800  # 30分钟
  conn_max_idle_time: 600  # 10分钟

# 日志配置
log:
  slow_threshold: 200     # 慢查询阈值(毫秒)
  enable_logging: true    # 启用SQL日志
  log_level: warn        # 日志级别

# 性能配置
performance:
  prepare_stmt: true      # 启用预编译语句
  disable_foreign_key: false  # 不禁用外键约束