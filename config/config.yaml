# config/test-config.yaml
server:
  port: 8081
  mode: "debug"
  read_timeout: 30
  write_timeout: 30
  shutdown_timeout: 10
  enable_gzip: true
  max_request_body: 10485760  # 10MB

mysql:
  master:
    host: "rm-cn-4xl3jlx19000cswo.rwlb.rds.aliyuncs.com"
    port: 3306
    user: "dingo_normal"
    password: "dingoNormalMysql001"
    dbname: "test_db"
    charset: "utf8mb4"
    parse_time: true
    loc: "Local"
  pool:
    max_open_conns: 50
    max_idle_conns: 10
    conn_max_lifetime: 1800
    conn_max_idle_time: 600
  log:
    slow_threshold: 200
    enable_logging: true
    log_level: "info"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 50
  min_idle_connes: 5
  max_retries: 3

log:
  level: "debug"
  file: "./logs/test-app.log"
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true
  add_caller: true
  add_stack: true
  json_format: true

monitor:
  enable_metrics: true
  metrics_path: "/metrics"
  enable_health: true
  health_path: "/health"
  enable_profiling: true
  profile_path: "/debug/pprof"
  service_name: "test-service"
  service_version: "1.0.0"
  environment: "test"

security:
  enable_rate_limit: false  # 测试时关闭限流
  rate_limit: 100
  enable_cors: true
  enable_xss_filter: true
  enable_hsts: true
  allowed_origins:
    - "*"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"