# 认证配置
auth:
  type: jwt                    # 认证类型：jwt, oauth2, api_key
  jwt_secret: "your-super-secret-jwt-key-at-least-32-characters-long"
  jwt_expire: 60               # JWT过期时间(分钟)
  refresh_expire: 7            # 刷新令牌过期时间(天)
  issuer: "dgou-app"          # 签发者
  audience: "dgou-client"     # 受众
  enable_2fa: false           # 是否启用双因子认证
  enable_rbac: true           # 是否启用RBAC
  token_header: "Authorization" # Token请求头
  token_prefix: "Bearer"      # Token前缀

# OAuth2配置
oauth2:
  google:
    client_id: "your-google-client-id"
    client_secret: "your-google-client-secret"
    redirect_url: "http://localhost:8080/auth/google/callback"
    scopes:
      - "openid"
      - "email"
      - "profile"

  github:
    client_id: "your-github-client-id"
    client_secret: "your-github-client-secret"
    redirect_url: "http://localhost:8080/auth/github/callback"
    scopes:
      - "user:email"
      - "read:user"

  microsoft:
    client_id: "your-microsoft-client-id"
    client_secret: "your-microsoft-client-secret"
    redirect_url: "http://localhost:8080/auth/microsoft/callback"
    scopes:
      - "User.Read"
      - "openid"
      - "email"
      - "profile"

# RBAC配置
rbac:
  roles:
    super_admin:
      - "user:create"
      - "user:read"
      - "user:update"
      - "user:delete"
      - "article:create"
      - "article:read"
      - "article:update"
      - "article:delete"
      - "system:config"
      - "system:admin"

    admin:
      - "user:create"
      - "user:read"
      - "user:update"
      - "article:create"
      - "article:read"
      - "article:update"
      - "article:delete"
      - "system:config"

    user:
      - "user:read"
      - "user:update"
      - "article:create"
      - "article:read"
      - "article:update"
      - "article:delete"

    guest:
      - "article:read"